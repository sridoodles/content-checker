<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Content Quality Checker — Polestar Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pa-blue: #2249FF;
    --pa-yellow: #FFD822;
    --bg: #F7F7F5;
    --surface: #FFFFFF;
    --surface2: #F1F0ED;
    --border: rgba(0,0,0,0.1);
    --border-md: rgba(0,0,0,0.18);
    --text-primary: #111110;
    --text-secondary: #6B6A67;
    --text-tertiary: #A09F9B;
    --green: #1D9E75;
    --green-bg: #E1F5EE;
    --green-text: #0F6E56;
    --amber: #BA7517;
    --amber-bg: #FAEEDA;
    --amber-text: #854F0B;
    --red: #D85A30;
    --red-bg: #FAECE7;
    --red-text: #993C1D;
    --radius: 10px;
    --radius-lg: 14px;
  }

  body {
    font-family: 'Manrope', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
    font-size: 15px;
    line-height: 1.6;
  }

  .wrap { max-width: 760px; margin: 0 auto; }

  /* Header */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 2rem;
    padding-bottom: 1.25rem;
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--pa-blue); }
  .brand-name { font-size: 12px; font-weight: 600; color: var(--text-secondary); letter-spacing: 0.05em; text-transform: uppercase; }
  .sep { color: var(--border-md); }
  .tool-name { font-size: 12px; font-weight: 600; color: var(--text-primary); }
  .version { font-size: 11px; color: var(--text-tertiary); background: var(--surface2); padding: 3px 8px; border-radius: 20px; }

  /* Input card */
  .input-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    margin-bottom: 1rem;
  }
  .field-label {
    font-size: 11px; font-weight: 600; color: var(--text-secondary);
    letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 6px;
  }
  textarea {
    width: 100%; min-height: 160px; resize: vertical;
    font-family: 'Manrope', sans-serif; font-size: 14px; line-height: 1.65;
    color: var(--text-primary); background: var(--surface2);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; outline: none; transition: border-color 0.15s;
  }
  textarea:focus { border-color: var(--pa-blue); background: #fff; }
  textarea::placeholder { color: var(--text-tertiary); }

  .meta-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  input[type="text"] {
    width: 100%; font-family: 'Manrope', sans-serif; font-size: 13px;
    color: var(--text-primary); background: var(--surface2);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 9px 12px; outline: none; transition: border-color 0.15s;
  }
  input[type="text"]:focus { border-color: var(--pa-blue); background: #fff; }
  input[type="text"]::placeholder { color: var(--text-tertiary); }

  /* Actions */
  .actions {
    display: flex; align-items: center; gap: 10px; margin-bottom: 1.75rem;
  }
  .btn-primary {
    background: var(--pa-blue); color: #fff;
    border: none; border-radius: var(--radius);
    padding: 11px 24px; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: 'Manrope', sans-serif;
    transition: opacity 0.15s, transform 0.1s;
    display: flex; align-items: center; gap: 7px;
  }
  .btn-primary:hover { opacity: 0.87; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-ghost {
    background: none; color: var(--text-secondary);
    border: 1px solid var(--border-md); border-radius: var(--radius);
    padding: 11px 18px; font-size: 14px; font-weight: 500;
    cursor: pointer; font-family: 'Manrope', sans-serif;
    transition: background 0.15s;
  }
  .btn-ghost:hover { background: var(--surface2); }
  .wc { font-size: 12px; color: var(--text-tertiary); margin-left: auto; }

  /* Error */
  .error {
    display: none; background: var(--red-bg); color: var(--red-text);
    border: 1px solid rgba(216,90,48,0.25); border-radius: var(--radius);
    padding: 12px 14px; font-size: 13px; margin-bottom: 1rem;
  }
  .error.show { display: block; }

  /* Loading */
  .loading { display: none; text-align: center; padding: 2.5rem 0; }
  .loading.show { display: block; }
  .dots { display: flex; align-items: center; justify-content: center; gap: 7px; margin-bottom: 12px; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--pa-blue);
    animation: blink 1.3s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,100%{opacity:0.15} 50%{opacity:1} }
  .loading-text { font-size: 13px; color: var(--text-secondary); }

  /* Results */
  .results { display: none; }
  .results.show { display: block; }

  /* Overall */
  .overall {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 1.5rem;
    display: flex; align-items: center; gap: 1.5rem;
    margin-bottom: 1rem;
  }
  .overall-strip { width: 5px; border-radius: 3px; align-self: stretch; min-height: 72px; flex-shrink: 0; }
  .overall-num { font-size: 52px; font-weight: 600; line-height: 1; min-width: 90px; }
  .overall-label { font-size: 11px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .overall-verdict { font-size: 16px; font-weight: 600; margin-bottom: 5px; }
  .overall-summary { font-size: 13px; color: var(--text-secondary); line-height: 1.55; }

  /* Dim grid */
  .dims { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1rem; }
  @media (max-width: 560px) { .dims { grid-template-columns: repeat(2, 1fr); } }

  .dim-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 1rem 1.1rem 1rem;
  }
  .dim-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
  .dim-icon { font-size: 18px; color: var(--text-tertiary); }
  .pill {
    font-size: 10px; font-weight: 600; padding: 3px 8px;
    border-radius: 20px; letter-spacing: 0.03em;
  }
  .pill-good { background: var(--green-bg); color: var(--green-text); }
  .pill-fair { background: var(--amber-bg); color: var(--amber-text); }
  .pill-poor { background: var(--red-bg); color: var(--red-text); }

  .dim-name { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
  .dim-val { font-size: 30px; font-weight: 600; margin-bottom: 10px; }
  .track { height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; margin-bottom: 8px; }
  .fill { height: 100%; border-radius: 2px; width: 0; transition: width 0.7s cubic-bezier(0.4,0,0.2,1); }
  .dim-note { font-size: 11px; color: var(--text-secondary); line-height: 1.55; }

  /* Flags */
  .flags-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 1rem;
  }
  .flags-head {
    background: var(--surface2); padding: 10px 1.25rem;
    font-size: 11px; font-weight: 600; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 7px;
  }
  .flag-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 11px 1.25rem; border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .flag-row:last-child { border-bottom: none; }
  .flag-ico { font-size: 15px; color: var(--amber); flex-shrink: 0; margin-top: 1px; }
  .flag-issue { color: var(--text-primary); line-height: 1.5; }
  .flag-dim-label { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }

  /* Footer */
  .footer { text-align: center; margin-top: 2.5rem; font-size: 11px; color: var(--text-tertiary); }
  .footer span { color: var(--pa-blue); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="brand">
      <div class="brand-dot"></div>
      <span class="brand-name">Polestar Analytics</span>
      <span class="sep">·</span>
      <span class="tool-name">Content Quality Checker</span>
    </div>
    <span class="version">v1.0</span>
  </div>

  <div class="input-card">
    <div class="field-label">Paste your content</div>
    <textarea id="content" placeholder="Paste a blog post, case study, homepage copy, or any content you want to evaluate…"></textarea>
    <div class="meta-row">
      <div>
        <div class="field-label" style="margin-top:10px;">Content type</div>
        <input type="text" id="ctype" placeholder="e.g. Blog post, case study, web copy" />
      </div>
      <div>
        <div class="field-label" style="margin-top:10px;">Target keywords (optional)</div>
        <input type="text" id="keywords" placeholder="e.g. data engineering, AI analytics" />
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-primary" id="btn-run" onclick="runAnalysis()">
      <i class="ti ti-sparkles"></i> Analyze content
    </button>
    <button class="btn-ghost" onclick="clearAll()">Clear</button>
    <span class="wc" id="wc">0 words</span>
  </div>

  <div class="error" id="err"></div>

  <div class="loading" id="loading">
    <div class="dots">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div class="loading-text">Scoring across 6 dimensions…</div>
  </div>

  <div class="results" id="results">

    <div class="overall">
      <div class="overall-strip" id="o-strip"></div>
      <div class="overall-num" id="o-num">—</div>
      <div>
        <div class="overall-label">Overall quality score</div>
        <div class="overall-verdict" id="o-verdict"></div>
        <div class="overall-summary" id="o-summary"></div>
      </div>
    </div>

    <div class="dims" id="dims-grid"></div>

    <div class="flags-card">
      <div class="flags-head">
        <i class="ti ti-alert-triangle"></i> Flagged issues
      </div>
      <div id="flags-list"></div>
    </div>

  </div>

  <div class="footer">Powered by <span>Claude</span> · Internal tool · Polestar Analytics</div>

</div>

<script>
const DIMS = [
  { key: 'readability', icon: 'ti-typography',   name: 'Readability' },
  { key: 'ai_flavor',   icon: 'ti-robot',         name: 'Human-sounding' },
  { key: 'seo',         icon: 'ti-search',         name: 'SEO signals' },
  { key: 'clarity',     icon: 'ti-bulb',           name: 'Clarity' },
  { key: 'jargon',      icon: 'ti-ban',            name: 'Jargon-free' },
  { key: 'specificity', icon: 'ti-target',         name: 'Fact specificity' },
];

document.getElementById('content').addEventListener('input', () => {
  const w = document.getElementById('content').value.trim().split(/\s+/).filter(Boolean).length;
  document.getElementById('wc').textContent = w + ' word' + (w !== 1 ? 's' : '');
});

function clearAll() {
  ['content','ctype','keywords'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('wc').textContent = '0 words';
  document.getElementById('results').classList.remove('show');
  document.getElementById('err').classList.remove('show');
}

function scoreStyle(s) {
  if (s >= 75) return { color: '#1D9E75', pillClass: 'pill-good', label: 'Good' };
  if (s >= 50) return { color: '#BA7517', pillClass: 'pill-fair', label: 'Fair' };
  return { color: '#D85A30', pillClass: 'pill-poor', label: 'Needs work' };
}

async function runAnalysis() {
  const content = document.getElementById('content').value.trim();
  if (content.length < 80) { showErr('Please paste at least a paragraph of content to analyze.'); return; }

  const ctype = document.getElementById('ctype').value.trim() || 'content';
  const keywords = document.getElementById('keywords').value.trim();

  document.getElementById('err').classList.remove('show');
  document.getElementById('results').classList.remove('show');
  document.getElementById('loading').classList.add('show');
  document.getElementById('btn-run').disabled = true;

  const system = `You are a content quality analyst for Polestar Analytics, a data engineering, AI, and analytics firm. Score submitted content across six dimensions. Return ONLY valid JSON — no markdown, no preamble.

Scoring guide (0–100 each):
- readability: Sentence clarity, length variety, no walls of text. 80+ easy, 60–79 moderate, below 60 dense.
- ai_flavor: Human-sounding score (already inverted). Deduct for hollow openers ("In today's fast-paced world"), padded transitions, overuse of leverage/utilize/streamline/unlock, symmetrical bullet lists, lack of concrete examples. Higher = more human.
- seo: Keyword usage, heading signals, topic clarity, specificity of subject matter.
- clarity: Conciseness. Every sentence earns its place. Penalize padding, redundancy, throat-clearing intros.
- jargon: Jargon-free score (already inverted). Higher = less jargon. Flag specific buzzwords.
- specificity: Concrete data, named examples, real scenarios vs. vague superlatives (best-in-class, robust, world-class, cutting-edge).

Return this exact JSON:
{
  "overall": <0-100>,
  "verdict": "<short phrase>",
  "summary": "<one sentence diagnosis>",
  "scores": {
    "readability": <0-100>,
    "ai_flavor": <0-100>,
    "seo": <0-100>,
    "clarity": <0-100>,
    "jargon": <0-100>,
    "specificity": <0-100>
  },
  "notes": {
    "readability": "<max 12 words>",
    "ai_flavor": "<max 12 words>",
    "seo": "<max 12 words>",
    "clarity": "<max 12 words>",
    "jargon": "<max 12 words>",
    "specificity": "<max 12 words>"
  },
  "flags": [
    { "dim": "<dimension>", "issue": "<specific actionable flag, quote the phrase if possible>" }
  ]
}
flags: 3–6 items, most critical first. Quote actual phrases where possible.`;

  const userMsg = `Content type: ${ctype}${keywords ? '\nTarget keywords: ' + keywords : ''}\n\nContent:\n---\n${content}\n---`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system,
        messages: [{ role: 'user', content: userMsg }]
      })
    });
    const data = await res.json();
    const raw = (data.content || []).map(b => b.text || '').join('');
    const parsed = JSON.parse(raw.replace(/```json|```/g, '').trim());
    render(parsed);
  } catch(e) {
    showErr('Something went wrong. Please try again.');
  } finally {
    document.getElementById('loading').classList.remove('show');
    document.getElementById('btn-run').disabled = false;
  }
}

function render(d) {
  const overall = Math.round(d.overall);
  const oc = scoreStyle(overall);
  document.getElementById('o-num').textContent = overall;
  document.getElementById('o-num').style.color = oc.color;
  document.getElementById('o-strip').style.background = oc.color;
  document.getElementById('o-verdict').textContent = d.verdict || '';
  document.getElementById('o-summary').textContent = d.summary || '';

  const grid = document.getElementById('dims-grid');
  grid.innerHTML = '';
  DIMS.forEach(dim => {
    const score = Math.round(d.scores?.[dim.key] ?? 0);
    const note = d.notes?.[dim.key] ?? '';
    const c = scoreStyle(score);
    const card = document.createElement('div');
    card.className = 'dim-card';
    card.innerHTML = `
      <div class="dim-top">
        <i class="ti ${dim.icon} dim-icon"></i>
        <span class="pill ${c.pillClass}">${c.label}</span>
      </div>
      <div class="dim-name">${dim.name}</div>
      <div class="dim-val" style="color:${c.color}">${score}</div>
      <div class="track"><div class="fill" style="background:${c.color}" data-w="${score}"></div></div>
      <div class="dim-note">${note}</div>`;
    grid.appendChild(card);
  });
  setTimeout(() => {
    document.querySelectorAll('.fill').forEach(el => { el.style.width = el.dataset.w + '%'; });
  }, 60);

  const list = document.getElementById('flags-list');
  list.innerHTML = '';
  const flags = d.flags || [];
  if (!flags.length) {
    list.innerHTML = '<div class="flag-row"><i class="ti ti-circle-check flag-ico" style="color:var(--green)"></i><div class="flag-issue">No major issues flagged.</div></div>';
  } else {
    flags.forEach(f => {
      const row = document.createElement('div');
      row.className = 'flag-row';
      row.innerHTML = `<i class="ti ti-alert-triangle flag-ico"></i><div><div class="flag-issue">${f.issue}</div><div class="flag-dim-label">${f.dim}</div></div>`;
      list.appendChild(row);
    });
  }
  document.getElementById('results').classList.add('show');
  document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function showErr(msg) {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.classList.add('show');
}
</script>
</body>
</html>
